# MSVC на этой машине не умеет компилировать sqlite3.c с /Z7: командная строка
# отладочной записи не помещается в лимит C7 и cl.exe падает с D8050.
# Отключаем отладочную информацию только для C-части SQLite — Rust-код
# остаётся с полной отладкой.
[profile.dev.package.libsqlite3-sys]
debug = false
